<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyClick Tracker Live</title>
  <link rel="stylesheet" href="/ui/overlay.css" />
</head>
<body>
  <div class="ov" id="ov">
    <div class="m"><span class="num" id="n-w"></span><i id="u-w">WPM</i></div>
    <div class="sep"></div>
    <div class="m"><span class="num" id="n-c"></span><i id="u-c">CPM</i></div>
    <div class="sep"></div>
    <div class="m" id="m-s"><span class="num" id="n-s"></span><i id="u-s">SPS</i></div>
    <button class="x" id="x" title="Close" aria-label="Close live box"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    <svg class="spark" id="spark" viewBox="0 0 120 30" preserveAspectRatio="none" aria-hidden="true"><polyline id="spark-l" points=""/></svg>
    <span class="grip" id="grip" title="Drag to resize"></span>
  </div>
  <script src="/ui/themes.js"></script>
  <script src="/ui/units.js"></script>
  <script src="/ui/odometer.js"></script>
  <script src="/ui/overlay.js"></script>
</body>
</html>
